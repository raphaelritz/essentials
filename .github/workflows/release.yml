name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore signing key
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: echo "$FORK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fork-release.jks"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_forkStorePassword: ${{ secrets.FORK_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_forkKeyAlias: fork
          ORG_GRADLE_PROJECT_forkKeyPassword: ${{ secrets.FORK_STORE_PASSWORD }}
        run: gradle :app:assembleRelease -PforkStoreFile="$RUNNER_TEMP/fork-release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
